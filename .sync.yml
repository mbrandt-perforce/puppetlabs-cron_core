---
.rubocop.yml:
  default_configs:
    Layout/LineLength:
      Max: 260
    RSpec/NamedSubject:
      Enabled: false
    RSpec/SubjectStub:
      Enabled: false
Gemfile:
  optional:
    ":system_tests":
      - gem: puppet_litmus
        version: '~> 2.5'
      - gem: faraday
        version: '~> 2.5'
      - gem: serverspec
        version: '~> 2.41'

appveyor.yml:
  delete: true
.travis.yml:
  delete: true
.github/workflows/release.yml:
  unmanaged: false
.github/workflows/release_prep.yml:
  unmanaged: false
.gitlab-ci.yml:
  delete: true

